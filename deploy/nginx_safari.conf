# ==============================================================================
# CONFIGURACIÓN NGINX PARA SAFARI POS (AWS EC2 UBUNTU)
# Copiar o enlazar en /etc/nginx/sites-available/safari y habilitar en sites-enabled
# ==============================================================================

server {
    listen 80;
    server_name _; # O reemplazar por la IP pública de EC2 / dominio elástico

    client_max_body_size 25M;

    # Archivos estáticos recopilados (CSS, JS, imágenes de error)
    location /static/ {
        alias /home/ubuntu/ProyectoIntegrado/proyecto_safari/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Redirección proxy al socket Unix de Gunicorn
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/ProyectoIntegrado/proyecto_safari/gunicorn.sock;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
