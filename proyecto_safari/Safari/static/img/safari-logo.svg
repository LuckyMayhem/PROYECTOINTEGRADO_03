<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b3"/>
      <stop offset="35%" stop-color="#f5b041"/>
      <stop offset="70%" stop-color="#d4ac0d"/>
      <stop offset="100%" stop-color="#b7950b"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241d14"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Escudo exterior circular con borde dorado -->
  <circle cx="120" cy="120" r="112" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#f5b041" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Cabeza de León Geométrica Dorada (Estilo Moderno Safari) -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <!-- Melena exterior poligonal -->
    <polygon points="120,40 138,58 158,50 166,72 186,76 182,98 198,110 186,126 194,146 176,154 174,174 154,174 144,190 120,182 96,190 86,174 66,174 64,154 46,146 54,126 42,110 58,98 54,76 74,72 82,50 102,58"/>
    
    <!-- Rostro interior en contraste oscuro -->
    <polygon points="120,62 145,80 152,115 138,142 120,158 102,142 88,115 95,80" fill="#181512"/>

    <!-- Rasgos faciales dorados -->
    <!-- Frente y cejas -->
    <polygon points="120,78 135,92 120,88 105,92"/>
    <!-- Ojos penetrantes felinos -->
    <polygon points="104,102 114,106 106,110"/>
    <polygon points="136,102 126,106 134,110"/>
    <!-- Puente nasal y nariz -->
    <polygon points="118,92 122,92 124,122 128,126 120,132 112,126 116,122"/>
    <!-- Bigotera y mentón -->
    <polygon points="120,134 126,138 120,146 114,138"/>
    <!-- Puntos de acento -->
    <circle cx="102" cy="126" r="2"/>
    <circle cx="98" cy="130" r="1.8"/>
    <circle cx="138" cy="126" r="2"/>
    <circle cx="142" cy="130" r="1.8"/>
  </g>

  <!-- Pequeñas estrellas de calidad -->
  <g fill="#f5b041" opacity="0.8">
    <polygon points="120,202 122,207 127,207 123,210 125,215 120,212 115,215 117,210 113,207 118,207"/>
    <polygon points="100,200 101,204 105,204 102,206 103,210 100,208 97,210 98,206 95,204 99,204"/>
    <polygon points="140,200 141,204 145,204 142,206 143,210 140,208 137,210 138,206 135,204 139,204"/>
  </g>
</svg>
