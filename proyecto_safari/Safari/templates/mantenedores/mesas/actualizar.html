{% extends 'base.html' %}

{% block title %}Actualizar Mesa - Safari POS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">
        <div class="card shadow border-0 rounded-3 overflow-hidden">
            <div class="card-header bg-dark text-white p-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">
                    <i class="bi bi-pencil-square text-success me-2"></i> Actualizar Mesa #{{ mesa_editar.numero }}
                </h5>
                <a href="/mantenedores/mesas/" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Volver al Listado
                </a>
            </div>

            <div class="card-body p-4 bg-white">
                <form action="/mantenedores/mesas/guardar/" method="POST" id="formActualizarMesa">
                    {% csrf_token %}
                    <input type="hidden" name="mesa_id" value="{{ mesa_editar.id }}">

                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label fw-bold">Número de Mesa <span class="text-danger">*</span></label>
                            <input type="number" name="numero" class="form-control" required min="1" value="{{ mesa_editar.numero }}">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-bold">Capacidad Comensales <span class="text-danger">*</span></label>
                            <input type="number" name="capacidad" class="form-control" required min="1" max="50" value="{{ mesa_editar.capacidad }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Nombre / Descripción del Sector <span class="text-danger">*</span></label>
                            <input type="text" name="nombre" class="form-control" required value="{{ mesa_editar.nombre }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Estado de Disponibilidad <span class="text-danger">*</span></label>
                            <select name="estado" class="form-select">
                                <option value="disponible" {% if mesa_editar.estado == 'disponible' or mesa_editar.estado == 'desocupada' %}selected{% endif %}>Disponible (Libre para comensales)</option>
                                <option value="ocupada" {% if mesa_editar.estado == 'ocupada' %}selected{% endif %}>Ocupada (Con orden activa)</option>
                                <option value="reservada" {% if mesa_editar.estado == 'reservada' %}selected{% endif %}>Reservada (Apartada previamente)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                        <a href="/mantenedores/mesas/" class="btn btn-secondary">
                            <i class="bi bi-x-circle me-1"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-success fw-bold px-4">
                            <i class="bi bi-save me-1"></i> Actualizar Mesa
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
